name: build

# main에 들어올 때(PR 머지 포함)만 실행한다. 다른 브랜치·PR에서는 돌지 않는다 (Windows 러너 사용 시간 절약).
# 필요하면 Actions 탭 → build → "Run workflow"로 아무 브랜치에서나 직접 실행할 수 있다.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test -c Release

      - name: Publish (self-contained single exe)
        run: dotnet publish src/DayDeck.App -p:PublishProfile=win-x64

      - name: Publish (framework-dependent, needs .NET 10 Desktop Runtime)
        run: dotnet publish src/DayDeck.App -c Release -r win-x64 -p:SelfContained=false -p:PublishSingleFile=true -p:DebugType=none -o artifacts/publish/win-x64-fd

      - name: Smoke test on Windows
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -Exe artifacts/publish/win-x64/DayDeck.exe 

      - name: UI test (sample data, UI Automation)
        shell: pwsh
        run: ./scripts/ui-test.ps1 -Exe artifacts/publish/win-x64/DayDeck.exe -SeedProject tools/DayDeck.DevSeed -OutDir artifacts/screenshots

      - name: Update test (fake release, confirm, replace exe, restart)
        shell: pwsh
        run: ./scripts/update-test.ps1 -Exe artifacts/publish/win-x64/DayDeck.exe

      - name: Installer (setup.exe, choose folder, data under it)
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Exe artifacts/publish/win-x64/DayDeck.exe

      - name: Installer test (install to chosen folder, Data inside, uninstall keeps data)
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts/installer/*-setup.exe | Select-Object -First 1
          ./scripts/installer-test.ps1 -Setup $setup.FullName

      - uses: actions/upload-artifact@v5
        with:
          name: DayDeck-setup
          path: artifacts/installer/*-setup.exe

      - name: Microsoft Store package (MSIX)
        shell: pwsh
        run: ./scripts/build-msix.ps1 -TestCert

      - name: MSIX install test (packaged, LocalState, StartupTask)
        shell: pwsh
        run: |
          $msix = Get-ChildItem artifacts/msix/*-test.msix | Select-Object -First 1
          $cer = Get-ChildItem artifacts/msix/*-test.cer | Select-Object -First 1
          ./scripts/msix-test.ps1 -Msix $msix.FullName -Cer $cer.FullName

      - uses: actions/upload-artifact@v5
        with:
          name: DayDeck-msix
          path: artifacts/msix/

      # Store 등록용 스크린샷 (1920x1080). 화면 해상도를 바꾸므로 다른 테스트가 모두 끝난 뒤에 돈다.
      # 실패해도 빌드와 릴리스는 막지 않는다.
      - name: Store screenshots (1920x1080)
        continue-on-error: true
        shell: pwsh
        run: ./scripts/store-screenshots.ps1 -Exe artifacts/publish/win-x64/DayDeck.exe -SeedProject tools/DayDeck.DevSeed -OutDir artifacts/store-screenshots

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: store-screenshots
          path: artifacts/store-screenshots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ui-screenshots
          path: artifacts/screenshots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v5
        with:
          name: DayDeck-win-x64
          path: artifacts/publish/win-x64/DayDeck.exe

      - uses: actions/upload-artifact@v5
        with:
          name: DayDeck-win-x64-framework-dependent
          path: artifacts/publish/win-x64-fd/

  # main에 들어온 커밋의 버전(Directory.Build.props)에 아직 릴리스가 없으면 만든다.
  # 앱은 이 릴리스를 보고 새 버전을 알린다 (설치는 사용자가 확인한 뒤에).
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$version 릴리스가 이미 있어 건너뜁니다."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v5
        if: steps.version.outputs.exists == 'false'
        with:
          name: DayDeck-win-x64
          path: dl/self-contained

      - uses: actions/download-artifact@v5
        if: steps.version.outputs.exists == 'false'
        with:
          name: DayDeck-win-x64-framework-dependent
          path: dl/framework-dependent

      - uses: actions/download-artifact@v5
        if: steps.version.outputs.exists == 'false'
        with:
          name: DayDeck-setup
          path: dl/setup

      - name: Create release
        if: steps.version.outputs.exists == 'false'
        run: |
          v=${{ steps.version.outputs.version }}
          mkdir release
          cp dl/setup/*-setup.exe release/
          (cd dl/self-contained && zip -9 -j "../../release/DayDeck-$v-x64.zip" *)
          (cd dl/framework-dependent && zip -9 -j "../../release/DayDeck-$v-x64-framework-dependent.zip" *)
          (cd release && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # 바뀐 점: CHANGELOG.md의 "## 버전" 구역
          awk -v ver="$v" '$0 ~ "^## " ver "( |$)" { found = 1; next } /^## / && found { exit } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then git log -10 --pretty='- %s' > notes.md; fi
          gh release create "v$v" release/* --title "DayDeck $v" --notes-file notes.md --target "$GITHUB_SHA"
